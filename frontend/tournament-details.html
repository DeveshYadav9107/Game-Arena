<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tournament Details - GameArena</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="ga-navbar"></div>

<div class="container my-5" id="detailsContainer">
  <div class="ga-spinner-wrap"><div class="spinner-border text-primary"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  renderNavbar('tournaments');

  const params = new URLSearchParams(window.location.search);
  const tournamentId = params.get('id');
  const container = document.getElementById('detailsContainer');
  const user = Session.getUser();

  async function loadDetails() {
    if (!tournamentId) {
      container.innerHTML = '<p class="text-danger">No tournament specified.</p>';
      return;
    }

    try {
      const t = await TournamentAPI.getById(tournamentId);
      const slotsLeft = t.maxPlayers - t.approvedCount;

      let joinButton = '';
      if (user && user.role === 'player') {
        joinButton = `<button class="btn btn-ga-primary" id="joinBtn" ${slotsLeft <= 0 || t.status !== 'Upcoming' ? 'disabled' : ''}>
          <i class="bi bi-person-plus"></i> ${slotsLeft <= 0 ? 'Tournament Full' : 'Register for Tournament'}
        </button>`;
      } else if (!user) {
        joinButton = `<a href="login.html" class="btn btn-ga-primary"><i class="bi bi-box-arrow-in-right"></i> Login to Register</a>`;
      }

      let organizerActions = '';
      if (user && user.role === 'organizer' && user._id === t.organizer._id) {
        organizerActions = `
          <a href="edit-tournament.html?id=${t._id}" class="btn btn-ga-outline"><i class="bi bi-pencil"></i> Edit</a>
          <a href="registrations.html?id=${t._id}" class="btn btn-ga-outline"><i class="bi bi-people"></i> View Registered Players</a>
          <a href="matches.html?id=${t._id}" class="btn btn-ga-outline"><i class="bi bi-calendar-event"></i> Manage Matches</a>
          <button class="btn btn-outline-danger" id="deleteBtn"><i class="bi bi-trash"></i> Delete</button>
        `;
      }

      container.innerHTML = `
        <div class="row g-4 fade-in-up">
          <div class="col-lg-8">
            <div class="card ga-card p-4">
              <span class="badge ${statusBadgeClass(t.status)} mb-2" style="width: fit-content;">${t.status}</span>
              <h2 class="fw-bold">${t.name}</h2>
              <p class="text-muted"><i class="bi bi-joystick"></i> ${t.gameName}</p>
              <p>${t.description}</p>
              <hr>
              <div class="row">
                <div class="col-6 col-md-4 mb-3"><strong><i class="bi bi-calendar3"></i> Date</strong><br>${formatDate(t.date)}</div>
                <div class="col-6 col-md-4 mb-3"><strong><i class="bi bi-clock"></i> Time</strong><br>${t.time}</div>
                <div class="col-6 col-md-4 mb-3"><strong><i class="bi bi-geo-alt"></i> Venue</strong><br>${t.venueType}${t.venueDetails ? ' - ' + t.venueDetails : ''}</div>
                <div class="col-6 col-md-4 mb-3"><strong><i class="bi bi-people"></i> Slots</strong><br>${t.approvedCount}/${t.maxPlayers} filled</div>
                <div class="col-6 col-md-4 mb-3"><strong><i class="bi bi-ticket-perforated"></i> Entry Fee</strong><br>₹${t.entryFee}</div>
                <div class="col-6 col-md-4 mb-3"><strong><i class="bi bi-cash-coin"></i> Prize Pool</strong><br>₹${t.prizePool}</div>
              </div>
              <div class="d-flex flex-wrap gap-2 mt-2">
                ${joinButton}
                ${organizerActions}
              </div>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="card ga-card p-4 mb-3">
              <h6 class="fw-bold">Organized by</h6>
              <p class="mb-0">${t.organizer.name}</p>
              <p class="text-muted small">${t.organizer.email}</p>
            </div>
            <div class="card ga-card p-4">
              <h6 class="fw-bold mb-3">Quick Links</h6>
              <a href="matches.html?id=${t._id}" class="btn btn-ga-outline btn-sm w-100 mb-2"><i class="bi bi-calendar-event"></i> Match Schedule</a>
              <a href="leaderboard.html?id=${t._id}" class="btn btn-ga-outline btn-sm w-100 mb-2"><i class="bi bi-bar-chart"></i> Leaderboard</a>
              <a href="results.html?id=${t._id}" class="btn btn-ga-outline btn-sm w-100"><i class="bi bi-award"></i> Results</a>
            </div>
          </div>
        </div>
      `;

      const joinBtn = document.getElementById('joinBtn');
      if (joinBtn) {
        joinBtn.addEventListener('click', async () => {
          joinBtn.disabled = true;
          try {
            await RegistrationAPI.join(tournamentId);
            showToast('Registration submitted! Waiting for organizer approval.', 'success');
            joinBtn.textContent = 'Registration Pending';
          } catch (err) {
            showToast(err.message, 'danger');
            joinBtn.disabled = false;
          }
        });
      }

      const deleteBtn = document.getElementById('deleteBtn');
      if (deleteBtn) {
        deleteBtn.addEventListener('click', async () => {
          if (!confirm('Are you sure you want to delete this tournament? This cannot be undone.')) return;
          try {
            await TournamentAPI.remove(tournamentId);
            showToast('Tournament deleted', 'success');
            setTimeout(() => (window.location.href = 'tournaments.html'), 700);
          } catch (err) {
            showToast(err.message, 'danger');
          }
        });
      }
    } catch (err) {
      container.innerHTML = `<p class="text-danger">${err.message}</p>`;
    }
  }

  loadDetails();
</script>
</body>
</html>
