<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register - GameArena</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="ga-navbar"></div>

<div class="container">
  <div class="ga-auth-wrapper">
    <div class="card ga-auth-card p-4 fade-in-up">
      <div class="card-body">
        <h3 class="fw-bold text-center mb-1">Create Account</h3>
        <p class="text-muted text-center mb-4">Join GameArena as a Player or Organizer</p>

        <form id="registerForm" novalidate>
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" id="name" required />
            <div class="invalid-feedback">Please enter your name.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" required />
            <div class="invalid-feedback">Please enter a valid email.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="tel" class="form-control" id="phone" placeholder="Optional" />
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required minlength="6" />
            <div class="invalid-feedback">Password must be at least 6 characters.</div>
          </div>
          <div class="mb-3">
            <label class="form-label d-block">I want to register as</label>
            <div class="btn-group w-100" role="group">
              <input type="radio" class="btn-check" name="role" id="rolePlayer" value="player" checked />
              <label class="btn btn-outline-primary" for="rolePlayer"><i class="bi bi-controller"></i> Player</label>

              <input type="radio" class="btn-check" name="role" id="roleOrganizer" value="organizer" />
              <label class="btn btn-outline-primary" for="roleOrganizer"><i class="bi bi-trophy"></i> Organizer</label>
            </div>
          </div>
          <button type="submit" class="btn btn-ga-primary w-100" id="registerBtn">Create Account</button>
        </form>

        <p class="text-center mt-3 mb-0 small">
          Already have an account? <a href="login.html">Login here</a>
        </p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  renderNavbar('register');

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;

    if (!form.checkValidity()) {
      form.classList.add('was-validated');
      return;
    }

    const payload = {
      name: document.getElementById('name').value.trim(),
      email: document.getElementById('email').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      password: document.getElementById('password').value,
      role: document.querySelector('input[name="role"]:checked').value,
    };

    const btn = document.getElementById('registerBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Creating account...';

    try {
      const data = await AuthAPI.register(payload);
      Session.setSession(data);
      showToast(`Account created! Welcome, ${data.name}.`, 'success');
      setTimeout(() => (window.location.href = 'dashboard.html'), 700);
    } catch (err) {
      showToast(err.message, 'danger');
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  });
</script>
</body>
</html>
