<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leaderboard - GameArena</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="ga-navbar"></div>

<div class="container my-5">
  <h2 class="fw-bold mb-4"><i class="bi bi-bar-chart-fill"></i> Leaderboard</h2>

  <div class="card ga-card p-3">
    <div class="table-responsive">
      <table class="table table-ga align-middle">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>Matches Played</th>
            <th>Wins</th>
            <th>Losses</th>
            <th>Points</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody">
          <tr><td colspan="6" class="text-center"><div class="spinner-border text-primary"></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  renderNavbar('tournaments');

  const params = new URLSearchParams(window.location.search);
  const tournamentId = params.get('id');

  async function loadLeaderboard() {
    const tbody = document.getElementById('leaderboardBody');
    if (!tournamentId) {
      tbody.innerHTML = '<tr><td colspan="6">No tournament specified.</td></tr>';
      return;
    }

    try {
      const rows = await LeaderboardAPI.forTournament(tournamentId);

      if (rows.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No leaderboard data yet.</td></tr>';
        return;
      }

      tbody.innerHTML = rows
        .map((r) => {
          const rankClass = r.rank === 1 ? 'rank-1' : r.rank === 2 ? 'rank-2' : r.rank === 3 ? 'rank-3' : '';
          const rankIcon = r.rank <= 3 ? '<i class="bi bi-trophy-fill"></i> ' : '';
          return `
          <tr>
            <td class="${rankClass}">${rankIcon}#${r.rank}</td>
            <td>${r.player?.name || 'Unknown'}</td>
            <td>${r.matchesPlayed}</td>
            <td>${r.wins}</td>
            <td>${r.losses}</td>
            <td><strong>${r.points}</strong></td>
          </tr>`;
        })
        .join('');
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="6" class="text-danger">${err.message}</td></tr>`;
    }
  }

  loadLeaderboard();
</script>
</body>
</html>
