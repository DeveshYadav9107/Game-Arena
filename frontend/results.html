<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tournament Results - GameArena</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="ga-navbar"></div>

<div class="container my-5">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h2 class="fw-bold mb-0"><i class="bi bi-award-fill"></i> Tournament Results</h2>
    <button class="btn btn-ga-primary d-none" id="publishBtn"><i class="bi bi-megaphone"></i> Publish Results</button>
  </div>

  <div id="resultsContainer">
    <div class="ga-spinner-wrap"><div class="spinner-border text-primary"></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  renderNavbar('tournaments');

  const params = new URLSearchParams(window.location.search);
  const tournamentId = params.get('id');
  const user = Session.getUser();
  const container = document.getElementById('resultsContainer');

  async function checkOwnerAndShowPublish() {
    if (!user || user.role !== 'organizer') return;
    try {
      const tournament = await TournamentAPI.getById(tournamentId);
      if (tournament.organizer._id === user._id) {
        document.getElementById('publishBtn').classList.remove('d-none');
      }
    } catch (err) { /* ignore */ }
  }

  async function loadResults() {
    if (!tournamentId) {
      container.innerHTML = '<p class="text-muted">No tournament specified.</p>';
      return;
    }

    try {
      const result = await ResultAPI.getResult(tournamentId);

      const podium = `
        <div class="row g-4 mb-4 text-center">
          <div class="col-md-4 order-md-1">
            <div class="card ga-card p-4">
              <i class="bi bi-2-circle-fill text-secondary" style="font-size: 2rem;"></i>
              <h5 class="mt-2">Runner-Up</h5>
              <p class="mb-0 fw-bold">${result.runnerUp ? result.runnerUp.name : '-'}</p>
            </div>
          </div>
          <div class="col-md-4 order-md-0">
            <div class="card ga-card p-4 bg-ga-1 text-white">
              <i class="bi bi-trophy-fill" style="font-size: 2.5rem; color: #facc15;"></i>
              <h4 class="mt-2">Champion</h4>
              <p class="mb-0 fw-bold fs-5">${result.champion ? result.champion.name : '-'}</p>
            </div>
          </div>
          <div class="col-md-4 order-md-2">
            <div class="card ga-card p-4">
              <i class="bi bi-3-circle-fill" style="font-size: 2rem; color: #b45309;"></i>
              <h5 class="mt-2">Third Position</h5>
              <p class="mb-0 fw-bold">${result.thirdPosition ? result.thirdPosition.name : '-'}</p>
            </div>
          </div>
        </div>
      `;

      const rankingRows = result.finalRankings
        .map((r) => `<tr><td>#${r.rank}</td><td>${r.player?.name || 'Unknown'}</td><td>${r.points}</td></tr>`)
        .join('');

      container.innerHTML = `
        ${podium}
        <div class="card ga-card p-3">
          <h5 class="fw-bold mb-3">Final Rankings</h5>
          <div class="table-responsive">
            <table class="table table-ga">
              <thead><tr><th>Rank</th><th>Player</th><th>Points</th></tr></thead>
              <tbody>${rankingRows}</tbody>
            </table>
          </div>
        </div>
      `;
    } catch (err) {
      container.innerHTML = `<div class="alert alert-info">${err.message}</div>`;
    }
  }

  document.getElementById('publishBtn').addEventListener('click', async () => {
    if (!confirm('Publish final results? This will mark the tournament as Completed.')) return;
    try {
      await ResultAPI.publish(tournamentId);
      showToast('Results published!', 'success');
      loadResults();
    } catch (err) {
      showToast(err.message, 'danger');
    }
  });

  checkOwnerAndShowPublish();
  loadResults();
</script>
</body>
</html>
