<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tournaments - GameArena</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="ga-navbar"></div>

<div class="container my-5">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h2 class="fw-bold mb-0">All Tournaments</h2>
  </div>

  <!-- Search / Filter -->
  <div class="card ga-card p-3 mb-4">
    <div class="row g-2">
      <div class="col-md-5">
        <input type="text" id="searchInput" class="form-control" placeholder="Search by tournament or game name...">
      </div>
      <div class="col-md-3">
        <input type="text" id="gameFilter" class="form-control" placeholder="Filter by game (e.g. Valorant)">
      </div>
      <div class="col-md-3">
        <select id="statusFilter" class="form-select">
          <option value="">All Statuses</option>
          <option value="Upcoming">Upcoming</option>
          <option value="Ongoing">Ongoing</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
      <div class="col-md-1">
        <button id="searchBtn" class="btn btn-ga-primary w-100"><i class="bi bi-search"></i></button>
      </div>
    </div>
  </div>

  <div id="tournamentsGrid" class="row g-4">
    <div class="ga-spinner-wrap w-100">
      <div class="spinner-border text-primary" role="status"></div>
    </div>
  </div>

  <nav class="mt-4">
    <ul class="pagination justify-content-center" id="pagination"></ul>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  renderNavbar('tournaments');

  let currentPage = 1;

  async function loadTournaments(page = 1) {
    currentPage = page;
    const grid = document.getElementById('tournamentsGrid');
    grid.innerHTML = `<div class="ga-spinner-wrap w-100"><div class="spinner-border text-primary"></div></div>`;

    const params = { page, limit: 6 };
    const search = document.getElementById('searchInput').value.trim();
    const game = document.getElementById('gameFilter').value.trim();
    const status = document.getElementById('statusFilter').value;

    if (search) params.search = search;
    if (game) params.game = game;
    if (status) params.status = status;

    try {
      const data = await TournamentAPI.list(params);

      if (data.tournaments.length === 0) {
        grid.innerHTML = '<p class="text-muted text-center">No tournaments match your search.</p>';
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      grid.innerHTML = data.tournaments
        .map(
          (t) => `
        <div class="col-md-4">
          <div class="card ga-card h-100">
            <div class="card-img-top"></div>
            <div class="card-body">
              <span class="badge ${statusBadgeClass(t.status)} mb-2">${t.status}</span>
              <h5 class="card-title">${t.name}</h5>
              <p class="text-muted mb-1"><i class="bi bi-joystick"></i> ${t.gameName}</p>
              <p class="text-muted mb-1"><i class="bi bi-calendar3"></i> ${formatDate(t.date)} at ${t.time}</p>
              <p class="text-muted mb-1"><i class="bi bi-geo-alt"></i> ${t.venueType}</p>
              <p class="text-muted mb-3"><i class="bi bi-cash-coin"></i> Prize Pool: ₹${t.prizePool}</p>
              <a href="tournament-details.html?id=${t._id}" class="btn btn-ga-primary btn-sm w-100">View Details</a>
            </div>
          </div>
        </div>`
        )
        .join('');

      renderPagination(data.page, data.totalPages);
    } catch (err) {
      grid.innerHTML = `<p class="text-danger">${err.message}</p>`;
    }
  }

  function renderPagination(page, totalPages) {
    const pag = document.getElementById('pagination');
    if (totalPages <= 1) {
      pag.innerHTML = '';
      return;
    }
    let html = '';
    for (let i = 1; i <= totalPages; i++) {
      html += `<li class="page-item ${i === page ? 'active' : ''}">
        <a class="page-link" href="#" onclick="loadTournaments(${i}); return false;">${i}</a>
      </li>`;
    }
    pag.innerHTML = html;
  }

  document.getElementById('searchBtn').addEventListener('click', () => loadTournaments(1));
  document.getElementById('searchInput').addEventListener('keyup', (e) => {
    if (e.key === 'Enter') loadTournaments(1);
  });
  document.getElementById('statusFilter').addEventListener('change', () => loadTournaments(1));

  loadTournaments();
</script>
</body>
</html>
