<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Registered Players - GameArena</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="ga-navbar"></div>

<div class="container my-5">
  <h2 class="fw-bold mb-4"><i class="bi bi-people-fill"></i> Registered Players</h2>

  <div class="card ga-card p-3">
    <div class="table-responsive">
      <table class="table table-ga align-middle">
        <thead>
          <tr>
            <th>Player Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="registrationsBody">
          <tr><td colspan="5" class="text-center"><div class="spinner-border text-primary"></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  requireAuth('organizer');
  renderNavbar('dashboard');

  const params = new URLSearchParams(window.location.search);
  const tournamentId = params.get('id');

  async function loadRegistrations() {
    const tbody = document.getElementById('registrationsBody');
    if (!tournamentId) {
      tbody.innerHTML = '<tr><td colspan="5">No tournament specified.</td></tr>';
      return;
    }

    try {
      const registrations = await RegistrationAPI.forTournament(tournamentId);

      if (registrations.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No player has registered yet.</td></tr>';
        return;
      }

      tbody.innerHTML = registrations
        .map(
          (r) => `
        <tr>
          <td>${r.player?.name || 'Unknown'}</td>
          <td>${r.player?.email || '-'}</td>
          <td>${r.player?.phone || '-'}</td>
          <td><span class="badge ${statusBadgeClass(r.status)}">${r.status}</span></td>
          <td>
            ${
              r.status === 'Pending'
                ? `<button class="btn btn-sm btn-success me-1" onclick="handleAction('${r._id}', 'approve')"><i class="bi bi-check-lg"></i> Approve</button>
                   <button class="btn btn-sm btn-danger" onclick="handleAction('${r._id}', 'reject')"><i class="bi bi-x-lg"></i> Reject</button>`
                : '-'
            }
          </td>
        </tr>`
        )
        .join('');
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="5" class="text-danger">${err.message}</td></tr>`;
    }
  }

  async function handleAction(id, action) {
    try {
      if (action === 'approve') await RegistrationAPI.approve(id);
      else await RegistrationAPI.reject(id);
      showToast(`Registration ${action}d successfully`, 'success');
      loadRegistrations();
    } catch (err) {
      showToast(err.message, 'danger');
    }
  }

  loadRegistrations();
</script>
</body>
</html>
