<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Edit Tournament - GameArena</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="ga-navbar"></div>

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card ga-card p-4 fade-in-up">
        <h3 class="fw-bold mb-4"><i class="bi bi-pencil-square"></i> Edit Tournament</h3>
        <form id="tournamentForm" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Tournament Name</label>
              <input type="text" class="form-control" id="name" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Game Name</label>
              <input type="text" class="form-control" id="gameName" required>
            </div>
            <div class="col-12">
              <label class="form-label">Description</label>
              <textarea class="form-control" id="description" rows="3" required></textarea>
            </div>
            <div class="col-md-3">
              <label class="form-label">Date</label>
              <input type="date" class="form-control" id="date" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Time</label>
              <input type="time" class="form-control" id="time" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Venue Type</label>
              <select class="form-select" id="venueType">
                <option value="Online">Online</option>
                <option value="Offline">Offline</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Status</label>
              <select class="form-select" id="status">
                <option value="Upcoming">Upcoming</option>
                <option value="Ongoing">Ongoing</option>
                <option value="Completed">Completed</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Venue Details</label>
              <input type="text" class="form-control" id="venueDetails">
            </div>
            <div class="col-md-4">
              <label class="form-label">Max Players</label>
              <input type="number" class="form-control" id="maxPlayers" min="2" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Entry Fee (₹)</label>
              <input type="number" class="form-control" id="entryFee" min="0">
            </div>
            <div class="col-md-4">
              <label class="form-label">Prize Pool (₹)</label>
              <input type="number" class="form-control" id="prizePool" min="0">
            </div>
          </div>
          <button type="submit" class="btn btn-ga-primary mt-4 w-100" id="submitBtn">
            <i class="bi bi-check-circle"></i> Save Changes
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  requireAuth('organizer');
  renderNavbar('dashboard');

  const params = new URLSearchParams(window.location.search);
  const tournamentId = params.get('id');

  async function loadTournament() {
    try {
      const t = await TournamentAPI.getById(tournamentId);
      document.getElementById('name').value = t.name;
      document.getElementById('gameName').value = t.gameName;
      document.getElementById('description').value = t.description;
      document.getElementById('date').value = t.date.substring(0, 10);
      document.getElementById('time').value = t.time;
      document.getElementById('venueType').value = t.venueType;
      document.getElementById('status').value = t.status;
      document.getElementById('venueDetails').value = t.venueDetails || '';
      document.getElementById('maxPlayers').value = t.maxPlayers;
      document.getElementById('entryFee').value = t.entryFee;
      document.getElementById('prizePool').value = t.prizePool;
    } catch (err) {
      showToast(err.message, 'danger');
    }
  }

  document.getElementById('tournamentForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const payload = {
      name: document.getElementById('name').value.trim(),
      gameName: document.getElementById('gameName').value.trim(),
      description: document.getElementById('description').value.trim(),
      date: document.getElementById('date').value,
      time: document.getElementById('time').value,
      venueType: document.getElementById('venueType').value,
      status: document.getElementById('status').value,
      venueDetails: document.getElementById('venueDetails').value.trim(),
      maxPlayers: Number(document.getElementById('maxPlayers').value),
      entryFee: Number(document.getElementById('entryFee').value) || 0,
      prizePool: Number(document.getElementById('prizePool').value) || 0,
    };

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;

    try {
      await TournamentAPI.update(tournamentId, payload);
      showToast('Tournament updated successfully!', 'success');
      setTimeout(() => (window.location.href = `tournament-details.html?id=${tournamentId}`), 700);
    } catch (err) {
      showToast(err.message, 'danger');
      btn.disabled = false;
    }
  });

  loadTournament();
</script>
</body>
</html>
