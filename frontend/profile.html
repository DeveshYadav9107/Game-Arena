<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Profile - GameArena</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="ga-navbar"></div>

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card ga-card p-4 fade-in-up">
        <div class="text-center mb-4">
          <i class="bi bi-person-circle" style="font-size: 4rem; color: var(--ga-primary);"></i>
          <h4 class="mt-2 mb-0" id="profileName">-</h4>
          <span class="badge bg-ga-1" id="profileRole">-</span>
        </div>

        <form id="profileForm">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" id="name" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email (cannot be changed)</label>
            <input type="email" class="form-control" id="email" disabled>
          </div>
          <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="tel" class="form-control" id="phone">
          </div>
          <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" class="form-control" id="password" placeholder="Leave blank to keep current password" minlength="6">
          </div>
          <button type="submit" class="btn btn-ga-primary w-100" id="saveBtn">
            <i class="bi bi-check-circle"></i> Save Changes
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  requireAuth();
  renderNavbar('profile');

  async function loadProfile() {
    try {
      const me = await AuthAPI.me();
      document.getElementById('profileName').textContent = me.name;
      document.getElementById('profileRole').textContent = me.role;
      document.getElementById('name').value = me.name;
      document.getElementById('email').value = me.email;
      document.getElementById('phone').value = me.phone || '';
    } catch (err) {
      showToast(err.message, 'danger');
    }
  }

  document.getElementById('profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const payload = {
      name: document.getElementById('name').value.trim(),
      phone: document.getElementById('phone').value.trim(),
    };
    const password = document.getElementById('password').value;
    if (password) payload.password = password;

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;

    try {
      const updated = await UserAPI.updateProfile(payload);
      // keep localStorage user info in sync (name shown in navbar)
      const stored = Session.getUser();
      stored.name = updated.name;
      localStorage.setItem('ga_user', JSON.stringify(stored));

      showToast('Profile updated successfully!', 'success');
      document.getElementById('password').value = '';
      renderNavbar('profile');
    } catch (err) {
      showToast(err.message, 'danger');
    } finally {
      btn.disabled = false;
    }
  });

  loadProfile();
</script>
</body>
</html>
