<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login - GameArena</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="ga-navbar"></div>

<div class="container">
  <div class="ga-auth-wrapper">
    <div class="card ga-auth-card p-4 fade-in-up">
      <div class="card-body">
        <h3 class="fw-bold text-center mb-1">Welcome Back</h3>
        <p class="text-muted text-center mb-4">Login to your GameArena account</p>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" required />
            <div class="invalid-feedback">Please enter a valid email.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required minlength="6" />
            <div class="invalid-feedback">Password must be at least 6 characters.</div>
          </div>
          <button type="submit" class="btn btn-ga-primary w-100" id="loginBtn">Login</button>
        </form>

        <p class="text-center mt-3 mb-0 small">
          Don't have an account? <a href="register.html">Register here</a>
        </p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  renderNavbar('login');

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;

    if (!form.checkValidity()) {
      form.classList.add('was-validated');
      return;
    }

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Logging in...';

    try {
      const data = await AuthAPI.login({ email, password });
      Session.setSession(data);
      showToast(`Welcome back, ${data.name}!`, 'success');
      setTimeout(() => (window.location.href = 'dashboard.html'), 700);
    } catch (err) {
      showToast(err.message, 'danger');
      btn.disabled = false;
      btn.textContent = 'Login';
    }
  });
</script>
</body>
</html>
