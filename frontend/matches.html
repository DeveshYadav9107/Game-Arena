<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Match Schedule - GameArena</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="ga-navbar"></div>

<div class="container my-5">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h2 class="fw-bold mb-0"><i class="bi bi-calendar-event"></i> Match Schedule</h2>
    <button class="btn btn-ga-primary d-none" id="createMatchBtn" data-bs-toggle="modal" data-bs-target="#matchModal">
      <i class="bi bi-plus-circle"></i> Schedule Match
    </button>
  </div>

  <div class="card ga-card p-3 mb-3">
    <div class="table-responsive">
      <table class="table table-ga align-middle">
        <thead>
          <tr>
            <th>Round</th>
            <th>Player 1</th>
            <th>Player 2</th>
            <th>Date &amp; Time</th>
            <th>Score</th>
            <th>Winner</th>
            <th>Status</th>
            <th id="actionsHeader" class="d-none">Actions</th>
          </tr>
        </thead>
        <tbody id="matchesBody">
          <tr><td colspan="8" class="text-center"><div class="spinner-border text-primary"></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal: Create / Update Match -->
<div class="modal fade" id="matchModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="matchForm">
        <div class="modal-header">
          <h5 class="modal-title">Schedule a Match</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="matchId">
          <div class="mb-2">
            <label class="form-label">Round</label>
            <input type="text" class="form-control" id="round" placeholder="e.g. Round 1, Semi-Final" required>
          </div>
          <div class="mb-2">
            <label class="form-label">Player 1</label>
            <select class="form-select" id="player1" required></select>
          </div>
          <div class="mb-2">
            <label class="form-label">Player 2</label>
            <select class="form-select" id="player2" required></select>
          </div>
          <div class="row">
            <div class="col-6 mb-2">
              <label class="form-label">Match Date</label>
              <input type="date" class="form-control" id="matchDate" required>
            </div>
            <div class="col-6 mb-2">
              <label class="form-label">Match Time</label>
              <input type="time" class="form-control" id="matchTime" required>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-ga-primary">Save Match</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Modal: Update Result -->
<div class="modal fade" id="resultModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="resultForm">
        <div class="modal-header">
          <h5 class="modal-title">Update Match Result</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="resultMatchId">
          <div class="row">
            <div class="col-6 mb-2">
              <label class="form-label" id="p1ScoreLabel">Player 1 Score</label>
              <input type="number" class="form-control" id="player1Score" min="0" required>
            </div>
            <div class="col-6 mb-2">
              <label class="form-label" id="p2ScoreLabel">Player 2 Score</label>
              <input type="number" class="form-control" id="player2Score" min="0" required>
            </div>
          </div>
          <div class="mb-2">
            <label class="form-label">Winner</label>
            <select class="form-select" id="winner" required></select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-ga-primary">Save Result</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  renderNavbar('dashboard');

  const params = new URLSearchParams(window.location.search);
  const tournamentId = params.get('id');
  const user = Session.getUser();
  let isOwner = false;
  let approvedPlayers = [];

  async function init() {
    if (!tournamentId) {
      document.getElementById('matchesBody').innerHTML = '<tr><td colspan="8">No tournament specified.</td></tr>';
      return;
    }

    try {
      const tournament = await TournamentAPI.getById(tournamentId);
      isOwner = user && user.role === 'organizer' && user._id === tournament.organizer._id;

      if (isOwner) {
        document.getElementById('createMatchBtn').classList.remove('d-none');
        document.getElementById('actionsHeader').classList.remove('d-none');

        // Load approved players for the player dropdowns
        const registrations = await RegistrationAPI.forTournament(tournamentId);
        approvedPlayers = registrations
          .filter((r) => r.status === 'Approved')
          .map((r) => r.player);

        const options = approvedPlayers
          .map((p) => `<option value="${p._id}">${p.name}</option>`)
          .join('');
        document.getElementById('player1').innerHTML = options || '<option disabled>No approved players yet</option>';
        document.getElementById('player2').innerHTML = options || '<option disabled>No approved players yet</option>';
      }

      await loadMatches();
    } catch (err) {
      showToast(err.message, 'danger');
    }
  }

  async function loadMatches() {
    const tbody = document.getElementById('matchesBody');
    try {
      const matches = await MatchAPI.forTournament(tournamentId);

      if (matches.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted">No matches scheduled yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = matches
        .map(
          (m) => `
        <tr>
          <td>${m.round}</td>
          <td>${m.player1?.name || 'TBD'}</td>
          <td>${m.player2?.name || 'TBD'}</td>
          <td>${formatDate(m.matchDate)} ${m.matchTime}</td>
          <td>${m.player1Score} - ${m.player2Score}</td>
          <td>${m.winner ? m.winner.name : '-'}</td>
          <td><span class="badge ${statusBadgeClass(m.status)}">${m.status}</span></td>
          ${
            isOwner
              ? `<td>
                  <button class="btn btn-sm btn-ga-outline" onclick="openResultModal('${m._id}', '${m.player1?._id}', '${m.player1?.name}', '${m.player2?._id}', '${m.player2?.name}')">
                    <i class="bi bi-clipboard-check"></i> Result
                  </button>
                </td>`
              : ''
          }
        </tr>`
        )
        .join('');
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="8" class="text-danger">${err.message}</td></tr>`;
    }
  }

  document.getElementById('matchForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      tournament: tournamentId,
      round: document.getElementById('round').value.trim(),
      player1: document.getElementById('player1').value,
      player2: document.getElementById('player2').value,
      matchDate: document.getElementById('matchDate').value,
      matchTime: document.getElementById('matchTime').value,
    };

    try {
      await MatchAPI.create(payload);
      showToast('Match scheduled!', 'success');
      bootstrap.Modal.getInstance(document.getElementById('matchModal')).hide();
      e.target.reset();
      loadMatches();
    } catch (err) {
      showToast(err.message, 'danger');
    }
  });

  function openResultModal(matchId, p1Id, p1Name, p2Id, p2Name) {
    document.getElementById('resultMatchId').value = matchId;
    document.getElementById('p1ScoreLabel').textContent = `${p1Name} Score`;
    document.getElementById('p2ScoreLabel').textContent = `${p2Name} Score`;
    document.getElementById('winner').innerHTML = `
      <option value="${p1Id}">${p1Name}</option>
      <option value="${p2Id}">${p2Name}</option>
    `;
    new bootstrap.Modal(document.getElementById('resultModal')).show();
  }

  document.getElementById('resultForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const matchId = document.getElementById('resultMatchId').value;
    const payload = {
      player1Score: Number(document.getElementById('player1Score').value),
      player2Score: Number(document.getElementById('player2Score').value),
      winner: document.getElementById('winner').value,
    };

    try {
      await MatchAPI.updateResult(matchId, payload);
      showToast('Match result updated! Leaderboard refreshed.', 'success');
      bootstrap.Modal.getInstance(document.getElementById('resultModal')).hide();
      e.target.reset();
      loadMatches();
    } catch (err) {
      showToast(err.message, 'danger');
    }
  });

  init();
</script>
</body>
</html>
