<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard - GameArena</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="ga-navbar"></div>

<div class="container my-5" id="dashboardContainer">
  <div class="ga-spinner-wrap"><div class="spinner-border text-primary"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  requireAuth();
  renderNavbar('dashboard');

  const user = Session.getUser();
  const container = document.getElementById('dashboardContainer');

  async function loadOrganizerDashboard() {
    try {
      const data = await DashboardAPI.organizer();
      const myTournaments = await TournamentAPI.mine();

      container.innerHTML = `
        <h2 class="fw-bold mb-4">Organizer Dashboard</h2>
        <div class="row g-4 mb-4">
          <div class="col-md-3">
            <div class="ga-stat-card bg-ga-1">
              <div class="d-flex justify-content-between">
                <div><h3>${data.totalTournaments}</h3><small>Total Tournaments</small></div>
                <i class="bi bi-trophy-fill icon"></i>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="ga-stat-card bg-ga-2">
              <div class="d-flex justify-content-between">
                <div><h3>${data.totalPlayers}</h3><small>Total Players</small></div>
                <i class="bi bi-people-fill icon"></i>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="ga-stat-card bg-ga-3">
              <div class="d-flex justify-content-between">
                <div><h3>${data.totalRegistrations}</h3><small>Total Registrations</small></div>
                <i class="bi bi-person-check-fill icon"></i>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="ga-stat-card bg-ga-4">
              <div class="d-flex justify-content-between">
                <div><h3>${data.upcomingMatches.length}</h3><small>Upcoming Matches</small></div>
                <i class="bi bi-calendar-event-fill icon"></i>
              </div>
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="fw-bold mb-0">My Tournaments</h4>
          <a href="create-tournament.html" class="btn btn-ga-primary btn-sm"><i class="bi bi-plus-circle"></i> New Tournament</a>
        </div>
        <div class="card ga-card p-3 mb-4">
          <div class="table-responsive">
            <table class="table table-ga align-middle">
              <thead><tr><th>Name</th><th>Game</th><th>Date</th><th>Status</th><th>Action</th></tr></thead>
              <tbody>
                ${
                  myTournaments.length === 0
                    ? '<tr><td colspan="5" class="text-center text-muted">You have not created any tournaments yet.</td></tr>'
                    : myTournaments
                        .map(
                          (t) => `
                    <tr>
                      <td>${t.name}</td>
                      <td>${t.gameName}</td>
                      <td>${formatDate(t.date)}</td>
                      <td><span class="badge ${statusBadgeClass(t.status)}">${t.status}</span></td>
                      <td><a href="tournament-details.html?id=${t._id}" class="btn btn-sm btn-ga-outline">Manage</a></td>
                    </tr>`
                        )
                        .join('')
                }
              </tbody>
            </table>
          </div>
        </div>

        <h4 class="fw-bold mb-3">Upcoming Matches</h4>
        <div class="card ga-card p-3">
          <div class="table-responsive">
            <table class="table table-ga align-middle">
              <thead><tr><th>Tournament</th><th>Players</th><th>Date &amp; Time</th></tr></thead>
              <tbody>
                ${
                  data.upcomingMatches.length === 0
                    ? '<tr><td colspan="3" class="text-center text-muted">No upcoming matches.</td></tr>'
                    : data.upcomingMatches
                        .map(
                          (m) => `
                    <tr>
                      <td>${m.tournament?.name || '-'}</td>
                      <td>${m.player1?.name || 'TBD'} vs ${m.player2?.name || 'TBD'}</td>
                      <td>${formatDate(m.matchDate)} ${m.matchTime}</td>
                    </tr>`
                        )
                        .join('')
                }
              </tbody>
            </table>
          </div>
        </div>
      `;
    } catch (err) {
      container.innerHTML = `<p class="text-danger">${err.message}</p>`;
    }
  }

  async function loadPlayerDashboard() {
    try {
      const data = await DashboardAPI.player();

      container.innerHTML = `
        <h2 class="fw-bold mb-4">Player Dashboard</h2>
        <div class="row g-4 mb-4">
          <div class="col-md-4">
            <div class="ga-stat-card bg-ga-1">
              <div class="d-flex justify-content-between">
                <div><h3>${data.registeredTournaments.length}</h3><small>Registered Tournaments</small></div>
                <i class="bi bi-trophy-fill icon"></i>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="ga-stat-card bg-ga-2">
              <div class="d-flex justify-content-between">
                <div><h3>${data.upcomingMatches.length}</h3><small>Upcoming Matches</small></div>
                <i class="bi bi-calendar-event-fill icon"></i>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="ga-stat-card bg-ga-3">
              <div class="d-flex justify-content-between">
                <div><h3>${data.completedTournaments.length}</h3><small>Completed Tournaments</small></div>
                <i class="bi bi-award-fill icon"></i>
              </div>
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="fw-bold mb-0">My Registered Tournaments</h4>
          <a href="tournaments.html" class="btn btn-ga-primary btn-sm"><i class="bi bi-search"></i> Browse More</a>
        </div>
        <div class="card ga-card p-3 mb-4">
          <div class="table-responsive">
            <table class="table table-ga align-middle">
              <thead><tr><th>Name</th><th>Game</th><th>Date</th><th>Status</th><th>Action</th></tr></thead>
              <tbody>
                ${
                  data.registeredTournaments.length === 0
                    ? '<tr><td colspan="5" class="text-center text-muted">You are not registered for any tournaments yet.</td></tr>'
                    : data.registeredTournaments
                        .map(
                          (t) => `
                    <tr>
                      <td>${t.name}</td>
                      <td>${t.gameName}</td>
                      <td>${formatDate(t.date)}</td>
                      <td><span class="badge ${statusBadgeClass(t.status)}">${t.status}</span></td>
                      <td><a href="tournament-details.html?id=${t._id}" class="btn btn-sm btn-ga-outline">View</a></td>
                    </tr>`
                        )
                        .join('')
                }
              </tbody>
            </table>
          </div>
        </div>

        <h4 class="fw-bold mb-3">Upcoming Matches</h4>
        <div class="card ga-card p-3">
          <div class="table-responsive">
            <table class="table table-ga align-middle">
              <thead><tr><th>Tournament</th><th>Opponent</th><th>Date &amp; Time</th></tr></thead>
              <tbody>
                ${
                  data.upcomingMatches.length === 0
                    ? '<tr><td colspan="3" class="text-center text-muted">No upcoming matches.</td></tr>'
                    : data.upcomingMatches
                        .map((m) => {
                          const opponent = m.player1?._id === user._id ? m.player2?.name : m.player1?.name;
                          return `
                          <tr>
                            <td>${m.tournament?.name || '-'}</td>
                            <td>${opponent || 'TBD'}</td>
                            <td>${formatDate(m.matchDate)} ${m.matchTime}</td>
                          </tr>`;
                        })
                        .join('')
                }
              </tbody>
            </table>
          </div>
        </div>
      `;
    } catch (err) {
      container.innerHTML = `<p class="text-danger">${err.message}</p>`;
    }
  }

  if (user.role === 'organizer') {
    loadOrganizerDashboard();
  } else {
    loadPlayerDashboard();
  }
</script>
</body>
</html>
